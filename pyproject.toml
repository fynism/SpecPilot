[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specpilot"
version = "0.1.0"
description = "A specification-aware control layer for AI coding workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
specpilot = "specpilot.cli:main"

[tool.setuptools.packages.find]
include = ["specpilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["specpilot", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

